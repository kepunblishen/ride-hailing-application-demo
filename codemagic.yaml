# Unsigned build — Sideloadly signs with your free Apple ID
# No Apple Developer Portal / certificates needed on Codemagic

workflows:
  ios-release:
    name: Raide iOS Build (unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        XCODE_PROJECT: ios/Raide.xcodeproj
        XCODE_SCHEME: Raide
        # Optional: set RAIDE_GOOGLE_MAPS_API_KEY in Codemagic env for live maps
      xcode: latest

    scripts:
      - name: Build unsigned app for device
        script: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild-output.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "========== Swift compiler errors =========="
            grep -E "error:" /tmp/xcodebuild-output.log | tail -40 || true
            exit "$BUILD_STATUS"
          fi

      - name: Package IPA for Sideloadly
        script: |
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name "Raide.app" -path "*/Debug-iphoneos/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Raide.app not found"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          rm -rf build Payload
          mkdir -p build Payload
          cp -r "$APP_PATH" Payload/
          zip -r build/Raide.ipa Payload
          rm -rf Payload

    artifacts:
      - build/Raide.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - chrisharris@harpalytics.dev
        notify:
          success: true
          failure: true
