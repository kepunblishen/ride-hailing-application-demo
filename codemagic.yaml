# Unsigned build — Sideloadly signs with your free Apple ID
# No Apple Developer Portal / certificates needed on Codemagic
# No Snyk / security-scan steps — intentionally omitted
#
# Credential-only (set in Codemagic UI → Environment variables, Secure):
#   VUUM_GOOGLE_MAPS_API_KEY  — Maps SDK for iOS key (bundle ID com.vuum.app)
# Without it the IPA still builds; map shows the unavailable surface at runtime.

workflows:
  ios-release:
    name: Vuum iOS Build (unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      # Must match the Codemagic UI "Group" name for VUUM_GOOGLE_MAPS_API_KEY
      groups:
        - vuum_secrets
      vars:
        XCODE_PROJECT: ios/Vuum.xcodeproj
        XCODE_SCHEME: Vuum
        # Set VUUM_GOOGLE_MAPS_API_KEY as a secure env var in Codemagic UI
        # Group: vuum_secrets → Application → Environment variables
        # Injected into Secrets.xcconfig and passed to xcodebuild.
      xcode: latest

    scripts:
      - name: Inject Maps API key (credential env → Secrets.xcconfig)
        script: |
          set -euo pipefail
          # gitignored; Vuum.xcconfig optionally includes ../../Secrets.xcconfig
          if [ -n "${VUUM_GOOGLE_MAPS_API_KEY:-}" ]; then
            {
              echo "// Generated by Codemagic — do not commit"
              printf 'VUUM_GOOGLE_MAPS_API_KEY = %s\n' "$VUUM_GOOGLE_MAPS_API_KEY"
            } > ios/Secrets.xcconfig
            echo "VUUM_GOOGLE_MAPS_API_KEY is set — wrote ios/Secrets.xcconfig for Info.plist substitution"
          else
            echo "VUUM_GOOGLE_MAPS_API_KEY unset — build continues; map unavailable at runtime"
          fi

      - name: Resolve Swift packages
        script: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Build unsigned app for device
        script: |
          set -o pipefail
          rm -rf build/DerivedData
          mkdir -p build
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            VUUM_GOOGLE_MAPS_API_KEY="${VUUM_GOOGLE_MAPS_API_KEY:-}" \
            2>&1 | tee /tmp/xcodebuild-output.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "========== Swift compiler errors =========="
            grep -E "error:" /tmp/xcodebuild-output.log | tail -40 || true
            exit "$BUILD_STATUS"
          fi

      - name: Package IPA for Sideloadly
        script: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Debug-iphoneos/Vuum.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Vuum.app not found at $APP_PATH"
            find build/DerivedData -name "Vuum.app" 2>/dev/null || true
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (
            cd build
            rm -f Vuum.ipa
            zip -r Vuum.ipa Payload
          )
          rm -rf build/Payload
          ls -la build/Vuum.ipa

    artifacts:
      - build/Vuum.ipa
      - /tmp/xcodebuild-output.log

    publishing:
      email:
        recipients:
          - chrisharris@harpalytics.dev
        notify:
          success: true
          failure: true
