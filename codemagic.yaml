# Unsigned build — Sideloadly signs with your free Apple ID
# No Apple Developer Portal / certificates needed on Codemagic
# No Snyk / security-scan steps — intentionally omitted
#
# Maps key (Codemagic UI — required group name must match exactly):
#   1. Application → Environment variables → Group: vuum_secrets
#   2. Variable: VUUM_GOOGLE_MAPS_API_KEY (Secure) — Maps SDK for iOS, bundle ID com.vuum.app
# Flow: group env → inject script → ios/Secrets.xcconfig → Vuum.xcconfig #include?
#       + same value on xcodebuild only when set (Info.plist $(VUUM_GOOGLE_MAPS_API_KEY))
# Without the key the IPA still builds; map shows the unavailable surface at runtime.
# Create the empty group before first build if the key is not ready yet (group must exist).

workflows:
  ios-release:
    name: Vuum iOS Build (unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      # Exact Codemagic UI group name (Application or Team). Must exist or the build fails.
      groups:
        - vuum_secrets
      vars:
        XCODE_PROJECT: ios/Vuum.xcodeproj
        XCODE_SCHEME: Vuum
      xcode: latest

    scripts:
      - name: Inject Maps API key (credential env → Secrets.xcconfig)
        script: |
          set -euo pipefail
          # gitignored; ios/Vuum/Config/Vuum.xcconfig uses #include? "../../Secrets.xcconfig"
          if [ -n "${VUUM_GOOGLE_MAPS_API_KEY:-}" ]; then
            {
              echo "// Generated by Codemagic — do not commit"
              printf 'VUUM_GOOGLE_MAPS_API_KEY = %s\n' "$VUUM_GOOGLE_MAPS_API_KEY"
            } > ios/Secrets.xcconfig
            echo "VUUM_GOOGLE_MAPS_API_KEY is set — wrote ios/Secrets.xcconfig for Info.plist substitution"
          else
            echo "VUUM_GOOGLE_MAPS_API_KEY unset (group vuum_secrets OK, key missing) — build continues; map unavailable at runtime"
          fi

      - name: Resolve Swift packages
        script: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Build unsigned app for device
        script: |
          set -o pipefail
          rm -rf build/DerivedData
          mkdir -p build
          # Only pass the key on the CLI when set — an empty override would wipe
          # Secrets.xcconfig / Vuum.xcconfig substitution.
          MAPS_KEY_ARGS=()
          if [ -n "${VUUM_GOOGLE_MAPS_API_KEY:-}" ]; then
            MAPS_KEY_ARGS+=(VUUM_GOOGLE_MAPS_API_KEY="$VUUM_GOOGLE_MAPS_API_KEY")
          fi
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            "${MAPS_KEY_ARGS[@]}" \
            2>&1 | tee /tmp/xcodebuild-output.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "========== Swift compiler errors =========="
            grep -E "error:" /tmp/xcodebuild-output.log | tail -40 || true
            exit "$BUILD_STATUS"
          fi

      - name: Package IPA for Sideloadly
        script: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Debug-iphoneos/Vuum.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Vuum.app not found at $APP_PATH"
            find build/DerivedData -name "Vuum.app" 2>/dev/null || true
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (
            cd build
            rm -f Vuum.ipa
            zip -r Vuum.ipa Payload
          )
          rm -rf build/Payload
          ls -la build/Vuum.ipa

    artifacts:
      - build/Vuum.ipa
      - /tmp/xcodebuild-output.log

    publishing:
      email:
        recipients:
          - chrisharris@harpalytics.dev
        notify:
          success: true
          failure: true
